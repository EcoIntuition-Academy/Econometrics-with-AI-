<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="pdf.min.js"></script>
  <style>
    body { margin: 0; padding: 20px; background: #525659; }
    canvas { display: block; margin: 0 auto; background: #fff; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
  </style>
</head>
<body>
  <div id="status" style="color: white; font-family: sans-serif; text-align: center; margin-bottom: 10px;">Loading...</div>
  <canvas id="pdfCanvas"></canvas>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = '';
    
    async function init() {
      try {
        const params = new URLSearchParams(window.location.search);
        const pNum = parseInt(params.get('page') || '1', 10);
        document.getElementById('status').textContent = 'Loading page ' + pNum + '...';
        
        const loadingTask = pdfjsLib.getDocument({
          url: '/Econometrics%20(7).pdf',
          disableFontFace: false
        });
        const pdf = await loadingTask.promise;
        const page = await pdf.getPage(pNum);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.getElementById('pdfCanvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        
        await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        document.getElementById('status').textContent = 'Page ' + pNum + ' Complete!';
        window.done = true;
      } catch (e) {
        document.getElementById('status').textContent = 'Error: ' + e.message;
        console.error(e);
      }
    }
    init();
  </script>
</body>
</html>
